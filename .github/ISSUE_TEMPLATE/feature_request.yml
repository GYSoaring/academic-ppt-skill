name: Feature request
description: Propose a layout, input format, or quality gate.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and boundaries
      description: What must remain editable, traceable, or explicitly not claimed?
